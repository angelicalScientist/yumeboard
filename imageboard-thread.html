
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">

    <title>Thread | Yumeboard</title>

    <script>
        try {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark-mode");
            }
        } catch (error) {
            console.warn("Could not load saved theme preference.");
        }
    </script>

    <script src="./font-switcher.js"></script>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style-dark.css">
</head>

<body>
    <header class="site-header">
        <a
            href="./dashboard.html"
            class="site-logo-link"
            aria-label="Go to Yumeboard's dashboard"
        >
            <img
                src="./logotype.png"
                alt="Yumeboard"
                class="site-logo"
            >
        </a>
    </header>

    <main class="imageboard-page">
        <section id="threadPage" aria-live="polite">
            <p class="loading-message">Loading thread... ♡</p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer-links">
            <a href="./terms.html">Terms of Service</a>
            <span aria-hidden="true">♡</span>
            <a href="./privacy.html">Privacy Policy</a>
            <span aria-hidden="true">♡</span>
            <a href="./guidelines.html">Community Guidelines</a>
            <span aria-hidden="true">♡</span>
            <a href="./contact.html">Contact</a>
        </div>

        <p class="site-footer-copy">
            © 2026 Yumeboard
        </p>
    </footer>

    <!-- Supabase library and client initialization -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>
    <script src="./image-storage.js"></script>
    <script src="./theme.js"></script>

    <!-- Markdown rendering and HTML sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

    <!-- Shared appreciation buttons: load before the thread renderer -->
    <script src="./yumeboard-likes.js"></script>

    <!-- Thread rendering, replies, reports, and other thread features -->
    <script src="./imageboard-thread.js"></script>
</body>
</html>
