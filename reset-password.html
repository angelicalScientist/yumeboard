
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡ Reset Your Password ♡</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="site-header">
    <a href="dashboard.html" class="site-logo-link" aria-label="Yumeboard">
        <img src="logotype.png" alt="Yumeboard" class="site-logo">
    </a>
</header>

<main class="profile">
    <section class="card account-card">
        <h1>♡ Choose a New Password ♡</h1>

        <p>
            Almost there! Enter your new password below. 🌸
        </p>

        <form id="resetForm" hidden>
            <label for="newPassword">New password</label>
            <input
                type="password"
                id="newPassword"
                autocomplete="new-password"
                minlength="8"
                placeholder="New password ♡"
                required
            >

            <label for="confirmPassword">Confirm new password</label>
            <input
                type="password"
                id="confirmPassword"
                autocomplete="new-password"
                minlength="8"
                placeholder="Type it again ♡"
                required
            >

            <button type="submit" id="resetButton">
                Save New Password ♡
            </button>
        </form>

        <p id="resetMessage" role="status" aria-live="polite">
            Checking your recovery link... 🌸
        </p>

        <p>
            <a href="account.html">Back to Log In ♡</a>
        </p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script src="theme.js"></script>
<script src="./reset-password.js"></script>
</body>
</html>
