
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ Recover Your Account ♡</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="site-header">
    <a href="dashboard.html" class="site-logo-link" aria-label="Yumeboard">
        <img src="logotype.png" alt="Yumeboard" class="site-logo">
    </a>
</header>

<main class="profile">
    <section class="card account-card">
        <h1>♡ Forgot Your Password? ♡</h1>

        <p>
            No worries! Enter the email associated with
            your account and we'll send you a recovery link. 🌸
        </p>

        <form id="recoveryForm">
            <label for="recoveryEmail">Email</label>
            <input
                type="email"
                id="recoveryEmail"
                placeholder="Your account email ♡"
                autocomplete="email"
                required
            >

            <button type="submit" id="recoveryButton">
                Send Recovery Email ♡
            </button>
        </form>

        <p id="recoveryMessage" role="status" aria-live="polite"></p>

        <a href="account.html">Back to Log In ♡</a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script src="./forgot-password.js"></script>
</body>
</html>
