<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Imageboard</title>
    <script>
    if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark-mode");
    }
</script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-dark.css">
</head>

<body>

    <header class="site-header">
    <a href="dashboard.html" class="site-logo-link" aria-label="Go to Yumeboard's dashboard">
        <img src="logotype.png" alt="Yumeboard" class="site-logo">
    </a>
    </header>

    <main class="imageboard-page">

        <section class="imageboard-intro">
            <h2>Yumeboard</h2>

            <p>
                Pick a board to browse threads, or start a new one!
            </p>

            <button
                type="button"
                id="newThreadButton"
            >
                ✨ New thread
            </button>
        </section>

        <section
            id="boardsList"
            class="boards-list"
        >
            <p class="loading-message">
                Loading boards... ♡
            </p>
        </section>

        <section class="recent-threads-section">

            <h2>Recent threads</h2>

            <div id="recentThreads">
                <p class="loading-message">
                    Loading threads... ♡
                </p>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>
    <script src="theme.js"></script>
    <script src="./imageboard.js"></script>

</body>
<footer class="site-footer">
    <div class="site-footer-links">
        <a href="terms.html">Terms of Service</a>
        <span aria-hidden="true">♡</span>
        <a href="privacy.html">Privacy Policy</a>
        <span aria-hidden="true">♡</span>
        <a href="guidelines.html">Community Guidelines</a>
        <span aria-hidden="true">♡</span>
        <a href="contact.html">Contact</a>
    </div>

    <p class="site-footer-copy">
        © 2026 Yumeboard
    </p>
</footer>
</html>
