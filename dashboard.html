<!DOCTYPE html>

<html lang="en">

<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cool dashboard!!</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header class="site-header">
    <a href="dashboard.html" class="site-logo-link" aria-label="Go to Yumeboard's dashboard">
        <img src="logotype.png" alt="Yumeboard" class="site-logo">
    </a>
</header>

<main class="profile">

    <div
        id="punishmentNotice"
        class="punishment-notice-container"
        hidden
    ></div>
    <section class="card dashboard-card">

        <h1 id="welcomeMessage">
            ♡ Welcome! ♡
        </h1>

        <p id="dashboardUsername">
            Loading your profile...
        </p>


        <div class="dashboard-buttons">

            <button id="profileButton">
                ♡ My Profile
            </button>

            <button id="editButton">
                ✎ Edit Profile
            </button>

            <button id="homeButton">
                🌸 Discover
            </button>

            <button id="logoutButton">
                🚪 Log Out
            </button>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>

<script src="./dashboard.js"></script>

</body>

</html>
